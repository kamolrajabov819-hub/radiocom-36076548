# ⚠ `publish` almost certainly needs changing, and I could not verify it from
#   here. `bun run build` produces `.output/` (nitro) and never creates `dist/`
#   at all — check the repo root after a build. A publish directory that does
#   not exist means Netlify has nothing to serve and, more to the point here,
#   that the [[redirects]] table below may never be applied.
#
#   The likely fix is `publish = ".output/public"` together with the nitro
#   `netlify` preset, but that depends on how the site is wired on Netlify's
#   side, which is not visible from the repository. The 301s are duplicated in
#   the router so the migration is safe either way — see src/routes/**.
[build]
  command = "bun run build"
  publish = "dist"

[dev]
  targetPort = 8080

