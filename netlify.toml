# `publish = "dist"` is correct — do not "fix" it to `.output/public`.
#
# Nitro's output path is set by the preset. Netlify auto-detects and uses its
# own, whose `publicDir` is `{{ rootDir }}/dist/` (see nitro's netlify preset).
# A local `bun run build` uses the cloudflare preset instead and emits
# `.output/public`, which is why this looks wrong from a developer machine.
#
# An earlier version of this comment asserted the opposite, on the evidence of
# local builds alone. It was wrong, and a post-build script written against
# `.output/public` on the strength of it broke the Netlify deploy on PR #14.
# `scripts/lib/output-dir.ts` now discovers the directory instead of assuming.
[build]
  command = "bun run build"
  publish = "dist"

[dev]
  targetPort = 8080

