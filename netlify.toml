# --- generated:catalog-301 ---

# --- Agent discovery -------------------------------------------------------
# The `Link` headers that used to live here now come from
# `agentAcceptMiddleware` in src/start.ts.
#
# They were declared here first, and a scan of the live site then reported no
# `Link` header on the page at all. Two candidate causes, neither of which I
# could test from this sandbox: Netlify documents `[[headers]]` for static
# assets rather than for SSR function responses, and the globs were `/ru/*`,
# which does not match the canonical homepage `/ru`. Emitting from the handler
# that owns the response answers both, and keeps the header next to the
# Markdown negotiation it advertises.

# Discovery documents are meant to be fetched cross-origin by registries and
# agent runtimes, so they carry CORS. They are genuinely static files, which is
# what `[[headers]]` is for.
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json"

# Extensionless, so nothing infers a type from the filename: without this it
# would be served as application/octet-stream and every consumer would reject
# it. The profile parameter is what RFC 9727 uses to distinguish an API
# catalogue from any other linkset.
[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'

[[headers]]
  for = "/.well-known/agent-skills/*/SKILL.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
